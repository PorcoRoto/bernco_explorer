[project]
name = "bernco-explorer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alex", email = "alex.wm.spm@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "contextily>=1.7.1",
    "geopandas>=1.2.0",
    "ipyleaflet>=0.20.0",
    "ipython>=9.17.1",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "selenium>=4.51.0",
    "shapely>=2.2.0",
]

[project.scripts]
bernco-explorer = "bernco_explorer:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
